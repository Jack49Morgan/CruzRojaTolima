name: Comprobar mapa Machín (una vez)
on:
  push:
    branches: [main]
    paths: [.github/workflows/check-vcm.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          V=https://sia.cortolima.gov.co/arcgis/rest/services/Amenazas_Riesgos/AMENAZA_MACHIN_2026/MapServer
          curl -s -o a.png -D h1 "$V/export?bbox=-8460000,470000,-8330000,560000&bboxSR=3857&imageSR=3857&size=713,560&dpi=96&format=png32&transparent=true&f=image"; head -15 h1; file a.png; ls -la a.png
          curl -s -o b.png -D h2 "$V/1/images/8c1c549eea9784ada831b1ddeb1aae09"; head -12 h2; file b.png
          curl -s -D h3 -o i.json -H "Origin: https://jack49morgan.github.io" "$V/identify?geometry=-75.39,4.49&geometryType=esriGeometryPoint&sr=4326&layers=visible:1&tolerance=2&mapExtent=-75.6,4.3,-75.2,4.7&imageDisplay=800,600,96&returnGeometry=false&f=json"; grep -i 'access-control\|HTTP/' h3; head -c 600 i.json
          python3 -c "from PIL import Image; im=Image.open('a.png').convert('RGBA'); print('nontransparent px:', sum(1 for p in im.getdata() if p[3]>0))" || true
