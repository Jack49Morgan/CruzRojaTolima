name: Extraer GHS-POP Tolima (una vez)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/ghspop.yml]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y gdal-bin >/dev/null
      - name: Download the 100 m Mollweide tile covering Tolima and clip it
        run: |
          set -e
          BASE=https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_POP_GLOBE_R2023A
          mkdir out
          for E in 2025 2020; do
            N=GHS_POP_E${E}_GLOBE_R2023A_54009_100
            D=$BASE/$N/V1-0/tiles/
            curl -s "$D" | grep -o 'href="[^"]*R9_C1[01][^"]*"' || true
            curl -sf -o t.zip "$D${N}_V1_0_R9_C11.zip"
            ls -la t.zip; unzip -o -q t.zip -d t; ls t
            gdalinfo t/*.tif | grep -E 'Size is|Origin|Pixel Size|PROJCRS' | head
            gdal_translate -q -projwin -7650000 700000 -7400000 310000 -co COMPRESS=DEFLATE -co PREDICTOR=3 t/*.tif out/ghspop_${E}_tolima_100m_54009.tif
            gdalinfo -stats out/ghspop_${E}_tolima_100m_54009.tif | grep -E 'Size is|Origin|Pixel Size|STATISTICS_(MEAN|MAXIMUM)'
            rm -rf t t.zip
          done
          ls -la out
      - name: Save to the ghs-raw branch
        run: |
          cd out
          git init -q -b ghs-raw && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "GHS-POP R2023A recorte Tolima (100 m, Mollweide)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ghs-raw
