name: Mantener activo Supabase
# Supabase pauses free projects after 7 days without activity. A small read twice a week keeps
# the incident database awake even when nobody registers incidents for a while.
on:
  schedule:
    - cron: "41 13 * * 1,4"   # Mondays and Thursdays, 08:41 Colombia
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read one row from Supabase
        run: |
          url=$(sed -n 's/^ *url: *"\([^"]*\)".*/\1/p' incstore.js | head -1)
          key=$(sed -n 's/^ *key: *"\([^"]*\)".*/\1/p' incstore.js | head -1)
          if [ -z "$url" ] || [ -z "$key" ]; then echo "Supabase aún no configurado en incstore.js"; exit 0; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url/rest/v1/incidentes?select=id&limit=1" -H "apikey: $key" -H "Authorization: Bearer $key")
          echo "HTTP $code"; test "$code" -lt 500
