name: Actualizar alerta volcánica (SGC)
on:
  schedule:
    - cron: "41 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main, claude/project-thread-vyuk5g]
    paths:
      - .github/workflows/volcanes.yml
      - tools/sgc_volcanes.py
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/sgc_volcanes.py data/volcanes-sgc.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/volcanes-sgc.json
          git diff --cached --quiet || (git commit -m "Actualizar alerta volcánica (SGC)" && git push)
