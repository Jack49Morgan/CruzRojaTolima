name: Actualizar sismos (SGC)
on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sismos.yml
      - tools/sgc_sismos.py
permissions:
  contents: write
concurrency: data-commit
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/sgc_sismos.py data/sismos-sgc.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sismos-sgc.json
          git diff --cached --quiet || (git commit -m "Actualizar sismos (SGC)" && git pull --rebase && git push)
