name: Actualizar embalses (XM)
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/embalses.yml
      - tools/xm_embalses.py
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/xm_amoya_probe.py || true
      - run: python3 tools/xm_embalses.py data/embalses.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/embalses.json
          git diff --cached --quiet || (git commit -m "Actualizar datos de embalses (XM)" && git push)
