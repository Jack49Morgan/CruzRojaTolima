name: Actualizar histórico climático (CHIRPS, ONI, UNGRD)
# CHIRPS publishes the final monthly rain around the third week of the next month, so this runs on the 24th.
on:
  schedule:
    - cron: "41 9 24 * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/historico.yml
      - tools/chirps_historico.py
      - tools/ungrd_eventos.py
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir numpy==2.1.3 scipy==1.14.1
      # each source may fail on its own (site down); the other one still updates and the old file stays
      - run: python3 tools/chirps_historico.py index.html data/historico-lluvia.json
        continue-on-error: true
      - run: python3 tools/ungrd_eventos.py data/historico-eventos.json
        continue-on-error: true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historico-lluvia.json data/historico-eventos.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Actualizar histórico climático (CHIRPS, ONI, UNGRD)" && git pull --rebase && git push)
