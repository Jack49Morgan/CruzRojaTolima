name: Explorar SIMMA (SGC)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/simma.yml
      - tools/simma_discover.py
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/simma_discover.py data/simma-discovery.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/simma-discovery.json
          git diff --cached --quiet || (git commit -m "Exploración de servicios SIMMA" && git pull --rebase && git push)
