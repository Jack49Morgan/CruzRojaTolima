name: Alertas de lluvia
# Every 15 minutes: sums each IDEAM station's rain (24 h / 72 h) and sends a push to the subscribed phones
# when a threshold in data/umbrales-lluvia.json is passed. Secrets (Settings > Secrets and variables > Actions):
# VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, SUPABASE_SERVICE_ROLE_KEY. GitHub can run scheduled jobs a few minutes late.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Enviar un mensaje de prueba a todos los celulares suscritos"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: alertas-lluvia
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save --no-audit --no-fund web-push@3.6.7
      - run: node tools/alertas_lluvia.mjs
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRUEBA: ${{ inputs.prueba }}
