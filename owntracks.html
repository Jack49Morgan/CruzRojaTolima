<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Conectar vehículo</title>
<!-- Opened by the QR code of a vehicle (panel "🚑 Vehículos" in the dashboard). The vehicle's name, key and number
     travel in the part after "#", which the browser never sends to any server. The button hands OwnTracks a
     configuration (HTTP mode, this vehicle's address, Move mode), so the phone starts reporting as that vehicle. -->
<style>
:root{--bg:#f4f6f8;--fg:#1d2430;--muted:#5b6472;--panel:#fff;--line:#d9dee5;--red:#c8102e;--navy:#0b2a5b}
@media (prefers-color-scheme:dark){:root{--bg:#11161d;--fg:#e8edf3;--muted:#9aa5b4;--panel:#1a212b;--line:#2d3743}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:24px 16px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.big{display:block;text-align:center;background:var(--red);color:#fff;text-decoration:none;font-weight:700;font-size:18px;padding:14px;border-radius:12px;margin:14px 0}
ol{padding-left:22px;margin:8px 0}
li{margin:6px 0}
.stores{display:flex;gap:8px;flex-wrap:wrap}
.stores a{flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--fg);text-decoration:none;font-size:14px}
.err{color:var(--red);font-weight:600}
code{font-size:13px;word-break:break-all}
h2{font-size:17px;margin:22px 0 4px;padding-top:14px;border-top:1px solid var(--line)}
button.big{width:100%;border:0;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.big.end{background:var(--navy)}
.row{display:flex;gap:8px}.row .big{flex:1;margin:8px 0}
.big.pause{background:#e68a00}
.note{background:rgba(230,138,0,.12);border:1px solid rgba(230,138,0,.45);border-radius:10px;padding:10px 12px;font-size:14px}
.copy{margin:6px 0;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);font:inherit;font-size:14px;cursor:pointer}
@media (prefers-color-scheme:dark){.big.end{background:#2f4f86}}
</style>
</head>
<body>
<main><div class="card" id="c"><p>Cargando…</p></div></main>
<script>
(() => {
  const c = document.getElementById("c");
  const esc = s => String(s).replace(/[&<>"]/g, x => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[x]);
  const p = new URLSearchParams(location.hash.slice(1));
  const nombre = p.get("n") || "Vehículo", clave = p.get("k") || "", tid = (p.get("t") || "").slice(-2);
  const base = "https://hxwntvubhxahzsfhxgav.supabase.co/functions/v1/ubicacion";   // same project as INC_CONFIG
  if (!/^[0-9a-f]{20,}$/i.test(clave)) { c.innerHTML = `<p class="err">Este código QR no tiene una clave de vehículo válida.</p><p>Pida un QR nuevo en el tablero (🚑 Vehículos).</p>`; return; }
  const url = `${base}?clave=${clave}`;
  // OwnTracks configuration (same keys on iPhone and Android): mode 3 = HTTP, monitoring 2 = Move
  const cfg = {_type:"configuration", mode:3, url, auth:false, usePassword:false, tid:tid || "CR",
    deviceId:nombre.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w]+/g, "-").replace(/^-+|-+$/g, "").toLowerCase().slice(0, 30) || "vehiculo",
    monitoring:2, pubExtendedData:true, locatorInterval:30, moveModeLocatorInterval:30, locatorDisplacement:30};
  const b64 = btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(cfg))));
  const link = "owntracks:///config?inline=" + encodeURIComponent(b64);
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  // OwnTracks "Quiet" mode (monitoring -1): it stops sending until the driver connects again
  const quiet = "owntracks:///config?inline=" + encodeURIComponent(btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify({...cfg, monitoring:-1})))));
  document.title = "Conectar " + nombre;
  c.innerHTML = `<h1>🚑 ${esc(nombre)}</h1>
    <p class="sub">Cruz Roja Colombiana, Seccional Tolima · ubicación en vivo</p>
    <p>Este celular va a enviar su ubicación como <b>${esc(nombre)}</b>. Si estaba conectado a otro vehículo, cambia a este.</p>
    <p class="note"><b>Solo la primera vez:</b> en OwnTracks abra ${ios ? "⚙️ <b>Settings</b>" : "☰ <b>Preferences</b>"} → <b>Remote Control</b> y active
      <b>Allow external configuration</b> (confirme el aviso). Si no, OwnTracks dice <i>"configuration not allowed"</i>.</p>
    <a class="big" id="go" href="${link}">Conectar a ${esc(nombre)} en OwnTracks</a>
    <ol>
      <li>Toque el botón rojo y elija <b>Abrir</b> en OwnTracks. Si pregunta, acepte la configuración (<b>Import</b> o <b>Importar</b>).</li>
      <li>Dé permiso de ubicación <b>${ios ? "Siempre" : "Permitir todo el tiempo"}</b>${ios ? " con Ubicación exacta" : " y desactive el ahorro de batería para OwnTracks"}.</li>
      <li>En OwnTracks toque la flecha de publicar (⇧) una vez. En el tablero aparece ${esc(nombre)}.</li>
    </ol>
    <h2>Pausa</h2>
    <p>Para una parada (almuerzo, atención): el vehículo queda fijo en el mapa donde está y no sigue al celular. El día no se cierra.</p>
    <div class="row"><button type="button" class="big pause" id="pausa">⏸ Pausar</button><button type="button" class="big" id="reanudar">▶ Reanudar</button></div>
    <p class="sub" id="pm">Deje esta página abierta (o guárdela) para reanudar sin escanear de nuevo.</p>
    <h2>Al terminar el día</h2>
    <p>Vuelva a escanear el código del vehículo y toque:</p>
    <button type="button" class="big end" id="fin">🅿 Terminar recorrido de ${esc(nombre)}</button>
    <p class="sub" id="finm">Tóquelo <b>donde deja el vehículo</b> (por ejemplo en el garaje): queda estacionado en ese punto del mapa
      aunque usted se vaya con el celular. El celular deja de enviar y los km del día quedan guardados. Para salir otra vez, toque el botón rojo de arriba.</p>
    <p>¿No tiene OwnTracks? Instálelo primero y vuelva a escanear el código:</p>
    <div class="stores"><a href="https://apps.apple.com/app/owntracks/id692424691">iPhone (App Store)</a>
      <a href="https://play.google.com/store/apps/details?id=org.owntracks.android">Android (Google Play)</a></div>
    <details style="margin-top:14px"><summary>Configurar a mano</summary>
      <p>Modo <b>HTTP</b>, URL:<br><code>${esc(url)}</code><br><button type="button" id="copy" class="copy">Copiar URL</button><br>TrackerID: <b>${esc(cfg.tid)}</b>, seguimiento en <b>Move</b>.</p></details>`;
  document.getElementById("copy").addEventListener("click", async e => {
    try { await navigator.clipboard.writeText(url); e.target.textContent = "✓ Copiada"; }
    catch { const r = document.createRange(); r.selectNodeContents(e.target.previousElementSibling.previousElementSibling); getSelection().removeAllRanges(); getSelection().addRange(r); e.target.textContent = "Seleccionada: copie con el menú"; } });
  // "Conectar": tell the server the vehicle is out again (so its positions count), then hand over to OwnTracks
  document.getElementById("go").addEventListener("click", async e => {
    e.preventDefault();
    await Promise.race([fetch(url + "&inicio=1", {method:"POST"}).catch(() => {}), new Promise(r => setTimeout(r, 3000))]);
    location.href = link;
  });
  const post = async q => { const r = await fetch(url + q, {method:"POST"});
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "error " + r.status); };
  document.getElementById("pausa").addEventListener("click", async e => {
    const m = document.getElementById("pm"); e.target.disabled = true; m.textContent = "Pausando…";
    try { const c = await aqui(); await post("&pausa=1" + (c ? `&lat=${c.latitude.toFixed(6)}&lon=${c.longitude.toFixed(6)}&accuracy=${Math.round(c.accuracy)}` : ""));
      m.innerHTML = "<b>⏸ En pausa.</b> El vehículo queda fijo en el mapa. Toque <b>Reanudar</b> al seguir."; }
    catch (err) { m.innerHTML = `<span class="err">No se pudo pausar: ${esc(err.message)}</span>`; }
    e.target.disabled = false; });
  document.getElementById("reanudar").addEventListener("click", async e => {
    const m = document.getElementById("pm"); e.target.disabled = true; m.textContent = "Reanudando…";
    try { await post("&reanudar=1"); m.innerHTML = "<b>▶ En marcha.</b> El mapa vuelve a seguir al vehículo."; }
    catch (err) { m.innerHTML = `<span class="err">No se pudo reanudar: ${esc(err.message)}</span>`; }
    e.target.disabled = false; });
  // where the phone is right now = where the vehicle stays parked (up to 10 s to get a fix)
  const aqui = () => new Promise(ok => { if (!navigator.geolocation) return ok(null);
    navigator.geolocation.getCurrentPosition(p => ok(p.coords), () => ok(null), {enableHighAccuracy:true, timeout:10000, maximumAge:30000}); });
  document.getElementById("fin").addEventListener("click", async e => {
    const m = document.getElementById("finm"); e.target.disabled = true; m.textContent = "Tomando la ubicación del vehículo…";
    try { const c = await aqui();
      const q = c ? `&lat=${c.latitude.toFixed(6)}&lon=${c.longitude.toFixed(6)}&accuracy=${Math.round(c.accuracy)}` : "";
      m.textContent = "Terminando…";
      const r = await fetch(url + "&fin=1" + q, {method:"POST"}); if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "error " + r.status);
      if (!c) m.textContent = "Sin GPS en este momento: el vehículo queda en su última posición."; }
    catch (err) { m.innerHTML = `<span class="err">No se pudo avisar al tablero (${esc(err.message)}). Igual se detiene el envío.</span>`; }
    location.href = quiet;   // OwnTracks opens and switches to Quiet
    setTimeout(() => { e.target.disabled = false; if (!m.querySelector(".err")) m.innerHTML = `<b>Listo, vehículo estacionado.</b> Si OwnTracks pregunta, acepte la configuración. Para salir otra vez toque <b>Conectar</b>.`; }, 1500);
  });
})();
</script>
</body>
</html>
